name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------
  # 1. Verification & Testing Jobs
  # -----------------------------------------------------------
  backend-check:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci
      - name: Typecheck & Build Backend
        working-directory: ./server
        run: npm run build

  frontend-check:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci
      - name: Test Frontend Static Export
        working-directory: ./client
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/flipped-classroom'
        run: npm run build

  # -----------------------------------------------------------
  # 2. Deployment: Backend to Vercel
  # -----------------------------------------------------------
  deploy-backend-vercel:
    name: Deploy Backend to Vercel
    needs: [backend-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deploy using amondnet/vercel-action if secrets are configured
      - name: Deploy Backend to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./server
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Notify if Vercel Secrets Missing
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "::notice title=Vercel Deployment Notice::To enable automatic Vercel backend deployment, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to your GitHub Repository Secrets."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # -----------------------------------------------------------
  # 3. Deployment: Frontend to GitHub Pages
  # -----------------------------------------------------------
  deploy-frontend-ghpages:
    name: Deploy Frontend to GitHub Pages
    needs: [frontend-check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup GitHub Pages Environment
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
          static_site_generator: next

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build & Export Static Site
        working-directory: ./client
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path || '/flipped-classroom' }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
