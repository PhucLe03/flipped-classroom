# LƯU Ý: Cron schedule của GitHub Actions thường xuyên bị trễ (delay từ 15-45+ phút)
# do hàng đợi quá tải vào giờ cao điểm, dẫn đến việc Render instance (ngủ sau 15 phút không có request) bị sleep.
# 
# Giải pháp: Lịch ping tự động định kỳ đã được chuyển sang External Cron Executor:
# 👉 Dịch vụ: cron-job.org (https://cron-job.org)
# 👉 Endpoint: https://flipped-classroom.onrender.com/api/health
# 👉 Tần suất khuyến nghị: Mỗi 10 phút (Execution schedule: Every 10 minutes)
#
# Workflow này được giữ lại với trigger 'workflow_dispatch' để dev có thể bấm chạy thủ công
# từ giao diện GitHub Actions bất cứ khi nào cần kiểm tra hoặc đánh thức backend tức thì.

name: Backend Keep-Alive (Manual & Fallback)

on:
  # schedule:
  #   - cron: '*/15 * * * *' # Đã tắt do delay từ GitHub Actions runners
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL backend cần ping kiểm tra (để trống sẽ dùng mặc định)'
        required: false
        default: 'https://flipped-classroom.onrender.com/api/health'

jobs:
  ping-backend:
    name: Ping & Keep Backend Alive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Keep-Alive Ping
        working-directory: ./server
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || secrets.BACKEND_API_URL || vars.BACKEND_API_URL || secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://flipped-classroom.onrender.com/api/health' }}
        run: |
          echo "🚀 Starting Backend Keep-Alive Ping..."
          npx --yes tsx scripts/keep-alive.ts "$TARGET_URL"

      - name: Add Job Summary
        if: always()
        run: |
          echo "### 📡 Kết Quả Keep-Alive Ping Backend" >> $GITHUB_STEP_SUMMARY
          echo "- **Thời gian thực thi:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trạng thái:** ${{ job.status == 'success' && '✅ Thành công' || '❌ Thất bại' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mục tiêu:** \`${{ github.event.inputs.target_url || secrets.BACKEND_API_URL || vars.BACKEND_API_URL || secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://flipped-classroom.onrender.com/api/health' }}\`" >> $GITHUB_STEP_SUMMARY
